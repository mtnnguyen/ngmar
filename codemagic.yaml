workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        APP_STORE_APP_ID: "6752107383"
        TEAM_ID: "2JQD483STZ"
        CERTIFICATE_PASSWORD: $CERTIFICATE_PASSWORD

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS app (no codesign yet)
        script: flutter build ios --release --no-codesign

      - name: Install signing assets (with debug logging)
        script: |
          echo "🔑 Initializing keychain..."
          keychain initialize
          
          echo "🔑 Adding certificate..."
          keychain add-certificates --certificate SurveilOne_Distribution.p12 --certificate-password "$CERTIFICATE_PASSWORD"
          echo "✅ Certificate installed."

          echo "📄 Adding provisioning profile..."
          keychain add-profiles --profile "SurveilOne TestFlight Profile"
          echo "✅ Provisioning profile installed."

          echo "📂 Listing installed certs & profiles..."
          keychain list-certificates
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Build IPA with signing
        script: |
          echo "🚀 Building signed IPA..."
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
