workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      vars:
        APP_STORE_APP_ID: 6752107383
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: 2JQD483STZ
      flutter: stable
      xcode: 16.4
      cocoapods: default
      groups:
        - app_store_credentials
        - signing   # CERTIFICATE_PASSWORD, CERTIFICATE_BASE64, PROVISION_PROFILE_BASE64

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Install signing certificate & profile manually (with debug)
        script: |
          set -x

          echo "Decoding certificate..."
          echo $CERTIFICATE_BASE64 | base64 --decode > SurveilOne_Distribution.p12
          ls -lh SurveilOne_Distribution.p12

          echo "Creating temporary keychain..."
          security create-keychain -p "" build.keychain
          security import SurveilOne_Distribution.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -A || echo "❌ CERTIFICATE IMPORT FAILED"
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-keychain-settings -lut 21600 ~/Library/Keychains/build.keychain

          echo "Verifying installed code signing identities..."
          security find-identity -v -p codesigning || echo "❌ No valid code signing identities found"

          echo "Decoding provisioning profile..."
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > SurveilOne_TestFlight_Profile.mobileprovision
          ls -lh SurveilOne_TestFlight_Profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp SurveilOne_TestFlight_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "❌ PROFILE COPY FAILED"

          echo "✅ Signing certificate & provisioning profile installed."

      - name: Force manual signing in project
        script: |
          set -x
          echo "Switching Runner target to manual signing..."
          /usr/libexec/PlistBuddy -c "Set :TargetAttributes:1:ProvisioningStyle Manual" ios/Runner.xcodeproj/project.pbxproj || true
          /usr/libexec/PlistBuddy -c "Add :TargetAttributes:1:DevelopmentTeam string $TEAM_ID" ios/Runner.xcodeproj/project.pbxproj || true
          /usr/libexec/PlistBuddy -c "Set :TargetAttributes:1:DevelopmentTeam $TEAM_ID" ios/Runner.xcodeproj/project.pbxproj || true
          grep -A3 ProvisioningStyle ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS app (manual signing enforced)
        script: |
          set -x
          security find-identity -v -p codesigning
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/Runner.xcarchive \
                     DEVELOPMENT_TEAM=$TEAM_ID \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="SurveilOne_TestFlight_Profile" \
                     archive

          xcodebuild -exportArchive \
                     -archivePath build/Runner.xcarchive \
                     -exportOptionsPlist ios/ExportOptions.plist \
                     -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
