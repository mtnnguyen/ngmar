workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      vars:
        APP_STORE_APP_ID: 6752107383
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: 2JQD483STZ
      flutter: stable
      xcode: 16.4
      cocoapods: default
      groups:
        - app_store_credentials
        - signing   # contains CERTIFICATE_PASSWORD, CERTIFICATE_BASE64, PROVISION_PROFILE_BASE64

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install signing certificate & profile manually
        script: |
          # Decode and install certificate (.p12)
          echo $CERTIFICATE_BASE64 | base64 --decode > SurveilOne_Distribution.p12
          security create-keychain -p "" build.keychain
          security import SurveilOne_Distribution.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -A
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-keychain-settings -lut 21600 ~/Library/Keychains/build.keychain

          # Decode and install provisioning profile
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > SurveilOne_TestFlight_Profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp SurveilOne_TestFlight_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS app
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
