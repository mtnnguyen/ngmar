workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
      groups:
        - signing
        - app_store_credentials

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install signing certificate & profile
        script: |
          echo $CERTIFICATE_BASE64 | base64 --decode > SurveilOne_Distribution.p12
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > SurveilOne_TestFlight_Profile.mobileprovision

          security create-keychain -p "" build.keychain
          security import SurveilOne_Distribution.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp SurveilOne_TestFlight_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Auto-increment build number
        script: |
          NEW_BUILD_NUMBER=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" ios/Runner/Info.plist
          echo "Set build number to $NEW_BUILD_NUMBER"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS app (manual signing)
        script: |
          set -x
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/Runner.xcarchive \
                     -destination generic/platform=iOS \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=$TEAM_ID \
                     PROVISIONING_PROFILE_SPECIFIER="SurveilOne_TestFlight_Profile" \
                     archive

          xcodebuild -exportArchive \
                     -archivePath build/Runner.xcarchive \
                     -exportOptionsPlist ios/ExportOptions.plist \
                     -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_API_KEY
