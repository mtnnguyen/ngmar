workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: "2JQD483STZ"
        APP_STORE_APP_ID: "6752107383"
      groups:
        - signing
        - app_store_credentials

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Decode signing files
        script: |
          echo $CERTIFICATE_BASE64 | base64 --decode > /tmp/cert.p12
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s ~/Library/Keychains/build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS app (manual signing)
        script: |
          flutter build ipa \
            --release \
            --no-codesign \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        apple_id: $APP_STORE_CONNECT_APPLE_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        submit_to_testflight: true
