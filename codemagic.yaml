workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      vars:
        APP_STORE_APP_ID: 6752107383
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: 2JQD483STZ
      flutter: stable
      xcode: 16.4
      cocoapods: default
      groups:
        - app_store_credentials
        - signing  # only CERTIFICATE_PASSWORD should be in this group

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS app (unsigned)
        script: |
          flutter build ios --release --no-codesign

      - name: Archive and export signed IPA
        script: |
          echo "📦 Archiving project manually..."
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/Runner.xcarchive \
                     DEVELOPMENT_TEAM=$TEAM_ID \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="SurveilOne_TestFlight_Profile" \
                     archive

          echo "🚀 Exporting signed IPA..."
          xcodebuild -exportArchive \
                     -archivePath build/Runner.xcarchive \
                     -exportOptionsPlist ios/ExportOptions.plist \
                     -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
