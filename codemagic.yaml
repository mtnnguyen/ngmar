workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: "2JQD483STZ"
        APP_STORE_APP_ID: "6752107383"
      groups:
        - signing
        - app_store_credentials

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Decode signing files
        script: |
          echo $CERTIFICATE_BASE64 | base64 --decode > /tmp/cert.p12
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s ~/Library/Keychains/build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "👉 Verifying provisioning profile..."
          PROFILE_NAME=$(security cms -D -i /tmp/profile.mobileprovision | \
            grep -A1 "<key>Name</key>" | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')
          TEAM_IDENTIFIER=$(security cms -D -i /tmp/profile.mobileprovision | \
            plutil -extract TeamIdentifier.0 raw -o - - 2>/dev/null)
          APP_IDENTIFIER=$(security cms -D -i /tmp/profile.mobileprovision | \
            grep -A1 "<key>application-identifier</key>" | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')

          echo "🔎 Found profile name: $PROFILE_NAME"
          echo "🔎 Found team identifier: $TEAM_IDENTIFIER"
          echo "🔎 Found app identifier: $APP_IDENTIFIER"

          if [ "$PROFILE_NAME" != "SurveilOne_TestFlight_Profile_New" ]; then
            echo "❌ ERROR: Provisioning profile name mismatch! Expected 'SurveilOne_TestFlight_Profile_New'."
            exit 1
          fi

          if [ "$TEAM_IDENTIFIER" != "2JQD483STZ" ]; then
            echo "❌ ERROR: TeamIdentifier mismatch! Expected '2JQD483STZ'."
            exit 1
          fi

          if [ "$APP_IDENTIFIER" != "2JQD483STZ.com.surveilone.ngmar" ]; then
            echo "❌ ERROR: App identifier mismatch! Expected '2JQD483STZ.com.surveilone.ngmar'."
            exit 1
          fi

          echo "✅ Provisioning profile verified successfully."

      - name: Build iOS app (manual signing)
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        apple_id: $APP_STORE_CONNECT_APPLE_ID
        api_key: $APP_STORE_CONNECT_API_KEY
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        submit_to_testflight: true
