workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials

      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        APP_STORE_APP_ID: "6752107383"
        TEAM_ID: "2JQD483STZ"
        PROVISIONING_PROFILE_NAME: "SurveilOne_TestFlight_Profile"

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS archive (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Install provisioning profile
        script: |
          echo "Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$CM_PROVISIONING_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug provisioning profiles
        script: |
          echo "Provisioning profiles after install:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "---- $profile ----"
            security cms -D -i "$profile" | grep -A 2 UUID
            security cms -D -i "$profile" | grep -A 2 Name
          done

      - name: Code sign & export IPA
        script: |
          xcode-project use-profiles
          cat <<EOF > export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --export-options-plist export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
