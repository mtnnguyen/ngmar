scripts:
  - name: Get Flutter dependencies
    script: flutter pub get

  - name: Install signing certificate & profile manually (with debug)
    script: |
      set -x
      echo $CERTIFICATE_BASE64 | base64 --decode > SurveilOne_Distribution.p12
      security create-keychain -p "" build.keychain
      security import SurveilOne_Distribution.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -A
      security default-keychain -s ~/Library/Keychains/build.keychain
      security unlock-keychain -p "" ~/Library/Keychains/build.keychain
      security set-keychain-settings -lut 21600 ~/Library/Keychains/build.keychain
      echo $PROVISION_PROFILE_BASE64 | base64 --decode > SurveilOne_TestFlight_Profile.mobileprovision
      mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      cp SurveilOne_TestFlight_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

  - name: Auto-increment build number
    script: |
      NEW_BUILD_NUMBER=$(date +%s)
      /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" ios/Runner/Info.plist
      echo "Set build number to $NEW_BUILD_NUMBER"

  - name: Install CocoaPods
    script: |
      cd ios
      pod install
      cd ..

  - name: Build iOS app (manual signing enforced)
    script: |
      set -x
      xcodebuild -workspace ios/Runner.xcworkspace \
                 -scheme Runner \
                 -configuration Release \
                 -archivePath build/Runner.xcarchive \
                 -allowProvisioningUpdates \
                 -destination generic/platform=iOS \
                 DEVELOPMENT_TEAM=$TEAM_ID \
                 CODE_SIGN_STYLE=Manual \
                 CODE_SIGN_IDENTITY="Apple Distribution" \
                 PROVISIONING_PROFILE_SPECIFIER="SurveilOne_TestFlight_Profile" \
                 archive

      xcodebuild -exportArchive \
                 -archivePath build/Runner.xcarchive \
                 -exportOptionsPlist ios/ExportOptions.plist \
                 -exportPath build/ios/ipa
