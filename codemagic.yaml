workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        APP_STORE_APP_ID: "6752107383"
        TEAM_ID: "2JQD483STZ"
        PROVISIONING_PROFILE_PATH: "codemagic_profiles/SurveilOne_TestFlight_Profile.mobileprovision"
      groups:
        - app_store_credentials

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS app (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Install certificate & provisioning profile
        script: |
          echo "🔑 Installing certificate..."
          echo "$CERTIFICATE_PASSWORD" | keychain add-certificates --certificate SurveilOne_Distribution.p12

          echo "📄 Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROVISIONING_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "✅ Installed provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Debug installed provisioning profile UUIDs
        script: |
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "---- $profile ----"
            security cms -D -i "$profile" | grep -A 5 UUID
            security cms -D -i "$profile" | grep -A 5 Name
          done

      - name: Build signed IPA
        script: |
          echo "🚀 Building signed IPA..."
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
