workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      vars:
        APP_STORE_APP_ID: 6752107383
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: 2JQD483STZ
        PROVISIONING_PROFILE_PATH: "codemagic_profiles/SurveilOne_TestFlight_Profile.mobileprovision"
        CERTIFICATE_PASSWORD: "test123456"
      flutter: stable
      xcode: 16.4
    scripts:
      - name: Install certificate & provisioning profile
        script: |
          echo "Installing certificate..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import SurveilOne_Distribution.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          echo "Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROVISIONING_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS app (unsigned)
        script: |
          flutter build ios --release --no-codesign

      - name: Build signed IPA
        script: |
          echo "Archiving project..."
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -archivePath build/Runner.xcarchive \
                     DEVELOPMENT_TEAM=$TEAM_ID \
                     archive

          echo "Exporting IPA..."
          xcodebuild -exportArchive \
                     -archivePath build/Runner.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
