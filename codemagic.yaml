workflows:
  ios-sim-preview:
    name: iOS Preview for Appetize
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appetize_credentials

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS simulator app using xcodebuild
        script: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            -derivedDataPath build/ios_sim_output

      - name: Zip .app for Appetize
        script: |
          cd build/ios_sim_output/Build/Products/Debug-iphonesimulator
          zip -r app.zip Runner.app

      - name: Upload to Appetize.io
        script: |
          curl --location --request POST "https://api.appetize.io/v1/apps" \
            --header "Authorization: Bearer $APPETIZE_API_TOKEN" \
            --form "file=@build/ios_sim_output/Build/Products/Debug-iphonesimulator/app.zip" \
            --form "platform=ios" \
            --form "note=NgMar Flutter App"

    artifacts:
      - build/ios_sim_output/Build/Products/Debug-iphonesimulator/app.zip
