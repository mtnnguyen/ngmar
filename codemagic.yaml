workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        APP_STORE_APP_ID: "6752107383"
        TEAM_ID: "2JQD483STZ"

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS app (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Use provisioning profiles & certificates
        script: |
          echo "🔑 Installing certs & profiles from Codemagic..."
          xcode-project use-profiles
          echo "✅ Installed provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Debug installed provisioning profile UUIDs
        script: |
          echo "📄 Dumping installed provisioning profiles..."
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "---- $profile ----"
            security cms -D -i "$profile" | grep -A 5 UUID
            security cms -D -i "$profile" | grep -A 5 Name
          done

      - name: Build signed IPA
        script: |
          echo "🚀 Building signed IPA..."
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
