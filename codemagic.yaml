workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials

      vars:
        BUNDLE_ID: "com.surveilone.ngmar"
        APP_STORE_APP_ID: "6752107383"
        TEAM_ID: "2JQD483STZ"

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build iOS archive (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Install signing assets
        script: |
          # Install certificate
          keychain initialize
          keychain add-certificates --certificate SurveilOne_Distribution.p12 --password $CERTIFICATE_PASSWORD
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$CM_PROVISIONING_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Code sign & export IPA
        script: |
          cat <<EOF > export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>SurveilOne TestFlight Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/ios/xcarchive/Runner.xcarchive \
            archive DEVELOPMENT_TEAM=${TEAM_ID} CODE_SIGN_STYLE=Manual

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/xcarchive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
