workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    environment:
      vars:
        APP_STORE_APP_ID: 6752107383
        BUNDLE_ID: "com.surveilone.ngmar"
        TEAM_ID: 2JQD483STZ
      flutter: stable
      xcode: 16.4
      cocoapods: default
      groups:
        - app_store_credentials   # contains APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
        - signing                 # contains CERTIFICATE_BASE64, CERTIFICATE_PASSWORD, PROVISION_PROFILE_BASE64

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install signing certificate & profile
        script: |
          echo $CERTIFICATE_BASE64 | base64 --decode > /tmp/certificate.p12
          echo $PROVISION_PROFILE_BASE64 | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import /tmp/certificate.p12 -k ~/Library/Keychains/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 🔍 Sanity check signing setup
        script: |
          echo "==> Checking available code signing identities..."
          security find-identity -v -p codesigning build.keychain || true

          echo ""
          echo "==> Listing installed provisioning profiles..."
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles || true

          echo ""
          echo "==> Checking profile details..."
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "---- $profile ----"
            security cms -D -i "$profile" | plutil -p - | grep -E 'Name|UUID|TeamIdentifier|application-identifier' || true
          done

      - name: Build iOS app (manual signing)
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - build/ios/ipa/*.log

    publishing:
      app_store_connect:
        apple_id: $APP_STORE_CONNECT_APPLE_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        private_key: $APP_STORE_CONNECT_PRIVATE_KEY
