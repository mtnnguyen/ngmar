name: inbox_app_modular
description: A modular inbox UI example.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^2.0.0
  http: ^0.13.6
  graphql_flutter: ^5.1.2
  hive_flutter: ^1.1.0
  connectivity_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
